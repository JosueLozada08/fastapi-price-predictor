version: 2.1

jobs:
  # ===========================================================
  # 1️⃣ Job: Build & Test
  # ===========================================================
  build_and_test:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Instalar dependencias y ejecutar pruebas
          command: |
            python -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            mkdir -p test-results coverage-results
            ./venv/bin/pytest --junitxml=test-results/junit.xml --cov=. --cov-report=xml:coverage-results/coverage.xml --cov-fail-under=70
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage-results

  # ===========================================================
  # 2️⃣ Job: Lint y Seguridad
  # ===========================================================
  lint_and_security:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Lint (flake8) y Seguridad (bandit y pip-audit)
          command: |
            python -m venv venv
            ./venv/bin/pip install flake8 bandit pip-audit
            echo "=== Lint ==="
            ./venv/bin/flake8 --max-line-length=120 .
            echo "=== Seguridad (bandit) ==="
            ./venv/bin/bandit -r . -f json -o bandit-report.json || true
            echo "=== Escaneo de dependencias (pip-audit) ==="
            ./venv/bin/pip-audit -f json -o pip-audit-report.json || true
      - store_artifacts:
          path: bandit-report.json
          destination: security/bandit-report.json
      - store_artifacts:
          path: pip-audit-report.json
          destination: security/pip-audit-report.json

  # ===========================================================
  # 3️⃣ Job: Análisis con SonarCloud / SonarQube
  # ===========================================================
  sonar_scan:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Generar cobertura para Sonar
          command: |
            python -m venv venv
            ./venv/bin/pip install -r requirements.txt pytest coverage
            ./venv/bin/pytest --cov=. --cov-report=xml:sonar/coverage.xml
      - run:
          name: Ejecutar análisis SonarCloud (con fallback)
          command: |
            ./venv/bin/pip install sonar-scanner-cli
            echo "=== Lanzando análisis Sonar ==="
            sonar-scanner \
              -Dsonar.projectKey=$SONAR_PROJECT_KEY \
              -Dsonar.organization=$SONAR_ORG \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN \
              -Dsonar.python.coverage.reportPaths=sonar/coverage.xml \
              || exit 0
      - store_artifacts:
          path: sonar/coverage.xml
          destination: sonar/coverage.xml

  # ===========================================================
  # 4️⃣ Job: Build y Push Docker
  # ===========================================================
  docker_build_and_push:
    docker:
      - image: cimg/base:stable
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Construir y publicar imagen Docker
          command: |
            sudo apt-get update && sudo apt-get install -y docker.io
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            APP_IMAGE="$DOCKERHUB_USERNAME/fastapi-price-predictor:${CIRCLE_SHA1}"
            docker build -t "$APP_IMAGE" .
            docker push "$APP_IMAGE"
            echo "IMAGE=$APP_IMAGE" >> $BASH_ENV
      - run:
          name: Mostrar etiqueta publicada
          command: |
            source $BASH_ENV
            echo "Imagen publicada: $IMAGE"

  # ===========================================================
  # 5️⃣ Job: Deploy a STAGING
  # ===========================================================
  deploy_staging:
    docker:
      - image: cimg/base:stable
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Desplegar a Staging (Heroku)
          command: |
            sudo apt-get update && sudo apt-get install -y curl
            curl https://cli-assets.heroku.com/install-ubuntu.sh | sh
            heroku container:login
            source $BASH_ENV || true
            IMAGE="${IMAGE:-$DOCKERHUB_USERNAME/fastapi-price-predictor:${CIRCLE_SHA1}}"
            docker pull "$IMAGE"
            docker tag "$IMAGE" registry.heroku.com/$HEROKU_APP_STAGING/web
            docker push registry.heroku.com/$HEROKU_APP_STAGING/web
            heroku container:release web -a $HEROKU_APP_STAGING
            echo "✅ Despliegue en STAGING exitoso"

  # ===========================================================
  # 6️⃣ Job: Deploy a PRODUCCIÓN
  # ===========================================================
  deploy_prod:
    docker:
      - image: cimg/base:stable
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Desplegar a Producción (Heroku)
          command: |
            sudo apt-get update && sudo apt-get install -y curl
            curl https://cli-assets.heroku.com/install-ubuntu.sh | sh
            heroku container:login
            source $BASH_ENV || true
            IMAGE="${IMAGE:-$DOCKERHUB_USERNAME/fastapi-price-predictor:${CIRCLE_SHA1}}"
            docker pull "$IMAGE"
            docker tag "$IMAGE" registry.heroku.com/$HEROKU_APP_PROD/web
            docker push registry.heroku.com/$HEROKU_APP_PROD/web
            heroku container:release web -a $HEROKU_APP_PROD
            echo "🚀 Producción desplegada correctamente"

  # ===========================================================
  # 7️⃣ Job: Notificación final
  # ===========================================================
  notify_summary:
    docker:
      - image: cimg/python:3.12
    steps:
      - run:
          name: Resumen final
          command: |
            echo "CI/CD finalizado ✅"
            echo "✔ build_and_test: pruebas unitarias y cobertura OK"
            echo "✔ lint_and_security: flake8 + bandit + pip-audit OK"
            echo "✔ sonar_scan: análisis Sonar ejecutado"
            echo "✔ docker_build_and_push: imagen publicada"
            echo "✔ deploy_staging / deploy_prod: listo tras aprobación"
            echo "🧩 Pipeline completo con control de calidad y despliegue"

# ===========================================================
# 🔁 WORKFLOWS (ramificación + despliegues)
# ===========================================================
workflows:
  version: 2

  # ----------------------------------------
  # CI normal (todas las ramas excepto main y tags)
  # ----------------------------------------
  ci_on_pr:
    jobs:
      - build_and_test:
          filters:
            branches:
              ignore: main
            tags:
              ignore: /.*/
      - lint_and_security:
          requires: [build_and_test]
          filters:
            branches:
              ignore: main
            tags:
              ignore: /.*/
      - sonar_scan:
          requires: [lint_and_security]
          filters:
            branches:
              ignore: main
            tags:
              ignore: /.*/
      - notify_summary:
          requires: [sonar_scan]
          filters:
            branches:
              ignore: main
            tags:
              ignore: /.*/

  # ----------------------------------------
  # Flujo CI + Staging (rama main)
  # ----------------------------------------
  ci_and_staging:
    jobs:
      - build_and_test:
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - lint_and_security:
          requires: [build_and_test]
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - sonar_scan:
          requires: [lint_and_security]
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - docker_build_and_push:
          requires: [sonar_scan]
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - hold_staging_approval:
          type: approval
          requires: [docker_build_and_push]
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - deploy_staging:
          requires: [hold_staging_approval]
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - notify_summary:
          requires: [deploy_staging]
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/

  # ----------------------------------------
  # Flujo de Release (tags vX.Y.Z → Producción)
  # ----------------------------------------
  deploy_to_prod:
    jobs:
      - build_and_test:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - lint_and_security:
          requires: [build_and_test]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - sonar_scan:
          requires: [lint_and_security]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - docker_build_and_push:
          requires: [sonar_scan]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - hold_prod_approval:
          type: approval
          requires: [docker_build_and_push]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - deploy_prod:
          requires: [hold_prod_approval]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - notify_summary:
          requires: [deploy_prod]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
