version: 2.1

jobs:
  build_and_test:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo
    steps:
      - checkout

      - run:
          name: Instalar dependencias y correr pruebas
          command: |
            python -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            mkdir -p test-results
            ./venv/bin/pytest --junitxml=test-results/junit.xml

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results
          destination: test-results

  lint_and_security:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo
    steps:
      - checkout

      - run:
          name: Lint (flake8) y Seguridad (bandit)
          command: |
            python -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install flake8 bandit
            echo "=== Ejecutando flake8 ==="
            ./venv/bin/flake8 --max-line-length=120 .
            echo "=== Ejecutando bandit ==="
            ./venv/bin/bandit -r . -f json -o bandit-report.json || true

      - store_artifacts:
          path: bandit-report.json
          destination: security/bandit-report.json

  notify_summary:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo
    steps:
      - run:
          name: Notificación resumen
          command: |
            echo "CI/CD finalizado 🎉"
            echo "Job 1: build_and_test (pytest OK)"
            echo "Job 2: lint_and_security (flake8 + bandit OK)"
            echo "Este paso actúa como notificación final del pipeline."

workflows:
  ci_pipeline:
    jobs:
      - build_and_test
      - lint_and_security:
          requires:
            - build_and_test
      - notify_summary:
          requires:
            - lint_and_security
